<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Contacto</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Jersey+10+Charted&family=Modak&family=Oi&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Oi&family=Dorsa&family=Alumni+Sans:wght@300;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* BODY */
body{
background-color:#FEF4DB;
font-family:'Alumni Sans', sans-serif;
}

/* TITULO */
h1{
text-align:center;
font-family:'Oi', cursive;
font-weight:400;
color:#595b3E;
font-size:65px;
margin-top:40px;
}

/* CONTENEDOR */
#contenedor{
width:90vw;
height:70vh;
margin:40px auto;
display:flex;
gap:30px;
}

/* IZQUIERDA */
#izquierda{
width:50%;
height:100%;
display:flex;
flex-direction:column;
gap:20px;
}

/* CAJAS IGUALES */
.caja{
height:33%;
background-color:#595b3E;
color:#FEF4DB;
padding:20px;
border-radius:20px;
box-shadow:0px 10px 25px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
justify-content:center;
}

/* CAJA DEL RÍO (GIF) */
.deco{
background-image:url("https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHI0a3QwYnNid2Vib3F1dHllZjdiOWJuaXRhcnBja2c4eTJ3OWQ4cSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKIzYtUMnuRQexq/giphy.gif");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* DERECHA */
#derecha{
width:50%;
height:100%;
border-radius:20px;
overflow:hidden;
box-shadow:0px 10px 25px rgba(0,0,0,0.25);
background-color:#292E16;
}

#derecha img{
width:100%;
height:100%;
object-fit:cover;
}

/* TEXTO */
h2{
font-family:'Dorsa', sans-serif;
font-size:42px;
margin-bottom:10px;
}

/* RESPONSIVE */
@media (max-width:900px){

#contenedor{
flex-direction:column;
height:auto;
}

#izquierda, #derecha{
width:100%;
height:auto;
}

.caja{
height:auto;
min-height:140px;
}

#derecha{
height:300px;
}

h1{
font-size:40px;
}

}

</style>
</head>

<body>

<h1>CONTACTO</h1>

<div id="contenedor">

<!-- IZQUIERDA -->
<div id="izquierda">

<div class="caja">
<h2>Gracias</h2>
<p>Gracias por visitar mi portfolio.</p>
</div>

<div class="caja deco"></div>

<div class="caja">
<h2>Contacto</h2>
<p>Email: ejemplo@gmail.com</p>
<p>Instagram: @usuario</p>
<p>LinkedIn / Behance</p>
</div>

</div>

<!-- DERECHA -->
<div id="derecha">
<img src="img/fondo_contacto.jpg" alt="imagen contacto">
</div>

</div>

</body>
</html>
